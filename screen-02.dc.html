  // Two states of one screen. The plan does not cross-fade into a sidebar —
  // there is only ever ONE plan, and it changes its own properties: type size,
  // dot size, padding, and what it is willing to show. Every row in the wide

  // does. The keys stay disjoint: `step`/`tech` are screen 01's, `at` is screen

      // duration, in both directions, starting at the same instant: the panes

      // space while the padding tightens. There is no sequence to read and no
      // seam to hide, which is the only way this stops looking like several

      // it clips instead of reflowing. Then it can collapse whenever it likes.

      exCols: on ? '0fr' : '1fr',

      iconSize: on ? '0px' : '11px',

      // These must equal the width the title ACTUALLY ends up with. Both
      // collapsed siblings leave their flex gap behind, which is what the first

      //                  card 248 row - 2 border - 20 pad - 12 gap - 8 gap = 206

      cardTitleMax: on ? '206px' : '800px',

      // pane out of the wrapping: at every instant the max-width is below the

      rowGap: on ? '12px' : '16px',
      rowPb: on ? '10px' : '24px',
      titleSize: on ? '12px' : '14px',
      titleLh: on ? '18px' : '22px',
      cardPad: on ? '10px' : '16px',

      // thing, the pair of chips, is pinned to the card's final measure.

      rmOp: on ? '1' : '0',
      rmOpDur: on ? '200ms' : '100ms',
      rmOpDl: on ? '200ms' : '0ms',

      // ── Selection: blue means "you are here" ─────────────────────────────

      dOp: on ? '1' : '0',
      dTr: 'translateY(0)',
      dDur: on ? '240ms' : '120ms',
      dDl: '0ms',

      crumbCols: on ? '1fr' : '0fr',
      crumbOp: on ? '1' : '0',
      // Same rule as the plan's columns: fade after it opens, fade before it

      crumbOpDur: on ? '200ms' : '110ms',
      crumbOpDl: on ? '160ms' : '0ms',
      planCrumbColor: on ? '#c3cdd7' : '#ffffff',

      // here: nothing on screen 02 animates, and the three phone screens are

      // also the honest reading — it is a different screen, not a transform.
      at1: this.state.at === 1,
      at2: this.state.at === 2,
      at3: this.state.at === 3,
      goTo1: () => this.setState({ at: 1 }),
      goTo2: () => this.setState({ at: 2 }),
      goTo3: () => this.setState({ at: 3 }),

      // showing. On row 3 at rest it stacks with the wash, which is the
      // orthogonality the rule already allows — selection and "your move" are

      selRow2: this.state.at === 2 ? '#4d97ea' : 'transparent',
      selRow3: this.state.at === 3 ? '#4d97ea' : 'transparent',

      // of its states; they exist as keys so the markup reads the same as

      runUpPE: 'auto',

      stageCap: this.state.at === 1
